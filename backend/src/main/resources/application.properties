server.port=8080

# Diretorio onde ficam os arquivos JSON de dados.
# Valor padrao funciona ao rodar via `mvn spring-boot:run` a partir de backend/.
# O Electron sobrescreve com um caminho absoluto e gravavel ao iniciar o jar
# (ex.: --app.data-dir=<userData>/data), evitando o bug do HTTP 500 quando o
# cwd e a pasta frontend/.
app.data-dir=src/main/resources/data